@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1A1A1A; --surface:#232323; --surface-2:#2D2D2C; --ink:#F0F0ED; --ink-2:#A2A29E; --line:#393937; --logo:#ECECE8;
    --accent:color-mix(in srgb,var(--brand) 62%,#FFFFFF); --accent-ink:#141414; --accent-soft:color-mix(in srgb,var(--brand) 22%,transparent);
    --ok:#5CC98E; --bad:#FF8A7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1A1A; --surface:#232323; --surface-2:#2D2D2C; --ink:#F0F0ED; --ink-2:#A2A29E; --line:#393937; --logo:#ECECE8;
  --accent:color-mix(in srgb,var(--brand) 62%,#FFFFFF); --accent-ink:#141414; --accent-soft:color-mix(in srgb,var(--brand) 22%,transparent);
  --ok:#5CC98E; --bad:#FF8A7A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
#app{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 14px;font-weight:500;white-space:nowrap;font-size:17px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{color:var(--bad)}
.field{display:grid;gap:6px}
.field label{font-size:15px;color:var(--ink-2);font-weight:500}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.input:focus{outline:none;border-color:var(--ink)}
input[type=color].input{padding:2px;height:42px;width:72px}
.muted{color:var(--ink-2)}
.eyebrow{font-size:15px;color:var(--ink-2);font-weight:500}

/* logo + wordmark (the logo is the college's own mark, recoloured through a mask) */
.logo{display:inline-block;height:36px;aspect-ratio:244/71;background:var(--logo);-webkit-mask:var(--logo-img) center/contain no-repeat;mask:var(--logo-img) center/contain no-repeat;flex:none}
.mark{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:0}
.mark svg{width:30px;height:16px;overflow:visible}
.mark path{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:120;animation:trace 2.6s ease-in-out infinite}
.brand{display:inline-flex;align-items:center;gap:14px}
.brand .rule{width:1px;align-self:stretch;background:var(--line)}
@keyframes trace{0%{stroke-dashoffset:120}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-120}}
.dot-live{width:8px;height:8px;background:var(--ok);display:inline-block;animation:blink 1.4s steps(2,jump-none) infinite}
.dot-live.off{background:var(--ink-2);animation:none}
@keyframes blink{50%{opacity:.25}}

/* ============ HOST ============ */
.host{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.host-top{display:flex;align-items:center;gap:22px;padding:clamp(6px,1.2vh,12px) 32px;border-bottom:4px solid var(--ink)}
.host-top .logo{height:clamp(26px,4.2vh,36px)}
.host-top .title{font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.host-top .spacer{flex:1}
.stat{display:flex;align-items:center;gap:8px}
.stat b{font-family:var(--display);font-size:26px;line-height:1;font-weight:700}
.stat span:last-child{font-size:15px;color:var(--ink-2)}
.progress{display:flex;gap:3px;align-items:center}

async function makeLive() {
  const base = `https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/`;
  await loadScript(base + 'firebase-app-compat.js');
  await loadScript(base + 'firebase-auth-compat.js');
  await loadScript(base + 'firebase-firestore-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.firestore();
  const R = c => db.collection('rooms').doc(c);
  async function wipe(q) { const s = await q.get(); let b = db.batch(), n = 0; for (const d of s.docs) { b.delete(d.ref); if (++n % 400 === 0) { await b.commit(); b = db.batch(); } } await b.commit(); }
  return {
    mode: 'live',
    onAuth(cb) { return auth.onAuthStateChanged(u => cb(u ? { uid: u.uid, email: u.email || null, anon: u.isAnonymous } : null)); },
    async anon() { if (!auth.currentUser) await auth.signInAnonymously(); return auth.currentUser.uid; },
    async hostLogin(email, pw) { await auth.signInWithEmailAndPassword(email, pw); },
    async logout() { await auth.signOut(); },
    watchRoom(c, cb, err) { return R(c).onSnapshot(s => cb(s.exists ? s.data() : null), e => err && err(e)); },
    async getRoom(c) { const s = await R(c).get(); return s.exists ? s.data() : null; },
    async listRooms() { const s = await db.collection('rooms').get(); return s.docs.map(d => ({ code: d.id, title: d.data().title || '', createdAt: d.data().createdAt || 0, n: (d.data().deck || []).length })); },
    async saveRoom(c, patch) { await R(c).set(patch, { merge: true }); },
    async replaceField(c, field, value) { await R(c).update({ [field]: value }); },
    watchAnswers(c, cb, err) { return R(c).collection('answers').onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => err && err(e)); },
    async submit(c, { qid, value, name }) { const u = auth.currentUser.uid; await R(c).collection('answers').doc(qid + '_' + u).set({ qid, uid: u, value, name: name || '', t: Date.now(), hidden: false }); },
    async hide(c, id, hidden) { await R(c).collection('answers').doc(id).update({ hidden }); },
    async clearAnswers(c, qid) { const col = R(c).collection('answers'); await wipe(qid ? col.where('qid', '==', qid) : col); },
    async clearPeople(c) { await wipe(R(c).collection('people')); },
    async join(c, name) { const u = auth.currentUser.uid; await R(c).collection('people').doc(u).set({ name: name || '', t: Date.now() }); },
    watchPeople(c, cb, err) { return R(c).collection('people').onSnapshot(s => cb(s.docs.map(d => d.data())), e => err && err(e)); }
  };
}

function makeDemo() {
  const st = { rooms: {}, answers: {}, people: {} };
  const L = { room: {}, answers: {}, people: {} };
  const snap = (k, c) => k === 'room' ? (st.rooms[c] ? JSON.parse(JSON.stringify(st.rooms[c])) : null)
    : k === 'answers' ? Object.entries(st.answers[c] || {}).map(([id, a]) => ({ id, ...a }))
      : Object.values(st.people[c] || {}).map(p => ({ ...p }));
  const emit = (k, c) => (L[k][c] || new Set()).forEach(fn => fn(snap(k, c)));
  const on = (k, c, cb) => { (L[k][c] ||= new Set()).add(cb); setTimeout(() => cb(snap(k, c)), 0); return () => L[k][c].delete(cb); };
  const me = 'you';
  return {
    mode: 'demo',
    onAuth(cb) { setTimeout(() => cb({ uid: me, email: 'demo', anon: false }), 0); return () => { }; },
    async anon() { return me; }, async hostLogin() { }, async logout() { },
    watchRoom: (c, cb) => on('room', c, cb),
    async getRoom(c) { return snap('room', c); },
    async listRooms() { return Object.entries(st.rooms).map(([code, r]) => ({ code, title: r.title || '', createdAt: r.createdAt || 0, n: (r.deck || []).length })); },
    async saveRoom(c, patch) { st.rooms[c] = deepMerge(st.rooms[c] || {}, patch); emit('room', c); },
    async replaceField(c, f, v) { st.rooms[c][f] = v; emit('room', c); },
    watchAnswers: (c, cb) => on('answers', c, cb),
    async submit(c, { qid, value, name }, uid = me) {
      const r = st.rooms[c]; if (!r || !r.cur || !r.cur.open || r.cur.qid !== qid) { const e = new Error('closed'); e.code = 'permission-denied'; throw e; }
      const id = qid + '_' + uid, a = (st.answers[c] ||= {});
      if (a[id] && a[id].hidden) { const e = new Error('hidden'); e.code = 'permission-denied'; throw e; }
      a[id] = { qid, uid, value, name: name || '', t: Date.now(), hidden: false }; emit('answers', c);
    },
    async hide(c, id, h) { st.answers[c][id].hidden = h; emit('answers', c); },
    async clearAnswers(c, qid) { const a = st.answers[c] || {}; for (const k in a) if (!qid || a[k].qid === qid) delete a[k]; emit('answers', c); },
    async clearPeople(c) { st.people[c] = {}; emit('people', c); },
    async join(c, name, uid = me) { (st.people[c] ||= {})[uid] = { name: name || '', t: Date.now() }; emit('people', c); },
    watchPeople: (c, cb) => on('people', c, cb)
  };
}

      <div class="field"><label for="rc">קוד חדר (אותיות באנגלית וספרות, 3-10 תווים)</label><input class="input" id="rc" dir="ltr" maxlength="10" required pattern="[A-Za-z0-9]{3,10}" placeholder="OPEN26"></div>
      <div class="field"><label for="rt">שם האירוע</label><input class="input" id="rt" value="כנס פתיחה - המכינה הקדם-אקדמית"></div>

    </form>
    ${B.mode === 'live' ? '<button class="btn ghost" type="button" id="lo">התנתקות</button>' : ''}
  </div></div>`;
  let known = new Set();
  B.listRooms().then(rs => {
    rs.sort((a, b) => b.createdAt - a.createdAt); known = new Set(rs.map(r => r.code));
    $('#rooms', root).innerHTML = rs.length ? rs.map(r => `<button type="button" data-room="${esc(r.code)}" class="${r.code === last ? 'cur' : ''}"><b>${esc(r.title || 'ללא שם')}</b><span class="code">${esc(r.code)}</span>
      <small>${r.createdAt ? new Date(r.createdAt).toLocaleDateString('he-IL') + ' · ' : ''}${r.n} שאלות${r.code === last ? ' · האירוע האחרון שפתחת' : ''}</small></button>`).join('')
      : '<p class="muted" style="margin:10px 0">עדיין אין אירועים. צרו את הראשון למטה.</p>';
  }).catch(e => { console.error(e); $('#rooms', root).innerHTML = '<p class="muted" style="margin:10px 0">לא הצלחתי לטעון את הרשימה. אפשר עדיין לפתוח אירוע לפי קוד למטה.</p>'; });
  $('#rooms', root).addEventListener('click', e => { const b = e.target.closest('[data-room]'); if (b) openRoom(root, b.dataset.room); });
  $('#rp', root).addEventListener('submit', e => {
    e.preventDefault(); const code = $('#rc', root).value.trim().toUpperCase(), er = $('#rperr', root);
    if (known.has(code)) { er.hidden = false; er.textContent = `האירוע ${code} כבר קיים. לחצו עליו ברשימה למעלה כדי לפתוח אותו, או בחרו קוד אחר.`; return; }
    openRoom(root, code, $('#rt', root).value.trim());
  });
  const lo = $('#lo', root); if (lo) lo.onclick = () => B.logout();
}

async function openRoom(root, code, title) {
  H.unsubs.forEach(f => f && f()); H.unsubs = [];
  H.code = code; H.room = null; H.answers = []; H.people = []; H.seen = new Set();
  try {
    let r = await B.getRoom(code);
    if (!r) {
      r = { title: title || (B.mode === 'demo' ? 'כנס פתיחה - המכינה הקדם-אקדמית' : 'אירוע חדש'), deck: DEFAULT_DECK, cur: { idx: -1, qid: null, open: false, view: 'wall', reveal: true }, summaries: {}, report: null, createdAt: Date.now() };
      await B.saveRoom(code, r);
    }
  } catch (e) { toast('אין הרשאה לחדר. בדקו שהאימייל שלכם מופיע בכללי האבטחה.'); console.error(e); return renderRoomPicker(root); }
  if (B.mode === 'live') LS.set('room', code);
  buildHostShell(root);
  const onErr = e => { console.error(e); toast('בעיית חיבור: ' + (e.code || e.message)); };
  H.unsubs.push(B.watchRoom(code, r => { H.room = r; renderHost(); }, onErr));
  H.unsubs.push(B.watchAnswers(code, a => { H.answers = a; renderHost(); }, onErr));
  H.unsubs.push(B.watchPeople(code, p => { H.people = p; renderHost(); }, onErr));
}

function buildHostShell(root) {
  root.innerHTML = `<div class="host">
    <header class="host-top" id="h-top"></header>
    <div class="host-main"><main class="stage" id="h-stage" aria-live="polite"></main><aside class="side" id="h-side"></aside><div class="phone-col" id="h-phone"></div></div>
    <nav class="controls" id="h-ctl" aria-label="שליטה"></nav>
  </div><div id="h-modal"></div>`;
  document.onkeydown = hostKeys;
  root.addEventListener('click', hostClick);
  if (B.mode === 'demo' && innerWidth >= 1700 && innerHeight >= 880) togglePhone(true);
}

function renderHost() {
  if (!H.room || !$('#h-top')) return;

function renderStage(c, q, n) {

      <div><div class="eyebrow">${esc(H.room.title || '')}</div>

        <div class="lobby-count"><b class="num">${H.people.length}</b><span>כבר בפנים</span></div>
        <div class="names">${named.map(p => `<span>${esc(p.name)}</span>`).join('')}</div></div>

  const countLbl = 'ענו' + (H.people.length ? ` מתוך ${H.people.length}` : '');
  let viz = st.querySelector('.viz');
  const key = q.id + '|' + (c.view || '') + '|' + (c.reveal !== false);
  if (!viz || st.dataset.key !== key) {
    st.innerHTML = meta + `<div class="q-row"><h1 class="q-text">${esc(q.text)}</h1><div class="big-count"><b class="num">${n}</b><span>${countLbl}</span></div></div><div class="viz"></div>`;

function renderWall(viz, list) {
  if (!list.length) { viz.innerHTML = `<div class="empty">${cur().open ? 'מחכים לתשובה הראשונה…' : 'אין עדיין תשובות'}</div>`; return; }
  const MAX = 60, shown = list.slice(0, MAX);
  viz.innerHTML = `<div class="wall">${shown.map(a => {
    const isNew = !H.seen.has(a.id); H.seen.add(a.id);
    return `<div class="card ${isNew ? 'new' : ''}">${esc(a.value)}${a.name ? `<small>${esc(a.name)}</small>` : ''}<button class="hide" data-act="hide" data-id="${esc(a.id)}" title="הסתרת התשובה מהמסך" aria-label="הסתרה">✕</button></div>`;
  }).join('')}</div>`;
}

const STOP = new Set('של את על עם זה זו זאת אני אתה את הוא היא אנחנו אתם הם הן לא כן גם או אבל כי מה איך יותר הכי כל יש אין רק עוד מאוד להיות היה שלי לי לנו לכם אם אז כמו בין אחרי לפני וגם שאני שזה אותי אותו משהו הרבה קצת ש ו ה ב ל מ כ עם שלא שיהיה יהיה זמן the and to of a in is'.split(' '));
// Each answer stays whole (never split into words). Identical answers are merged and grow with their count.
function cloudData(list) {
  const key = t => t.replace(/[֑-ׇ]/g, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
  const m = new Map();
  for (const a of [...list].sort((x, y) => x.t - y.t)) {
    const text = String(a.value).replace(/\s+/g, ' ').trim(), k = key(text);
    if (!k) continue;
    const g = m.get(k); if (g) g.n++; else m.set(k, { k, text, n: 1, c: m.size % 10 });
  }
  return [...m.values()].sort((a, b) => b.n - a.n).slice(0, 48);
}
function hashHue(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h % 10; }
function renderCloud(viz, list, qid) {
  const data = cloudData(list);
  if (!data.length) { viz.innerHTML = '<div class="empty">התשובות יופיעו כאן ברגע שיגיעו</div>'; return; }
  const max = data[0].n, min = data[data.length - 1].n;
  const arranged = []; data.forEach((d, i) => i % 2 ? arranged.push(d) : arranged.unshift(d));
  const anim = H.cloudAnim !== qid; H.cloudAnim = qid;
  const many = data.length > 24;
  viz.innerHTML = `<div class="cloud">${arranged.map((d, i) => {
    const r = max === min ? 0.5 : (Math.sqrt(d.n) - Math.sqrt(min)) / (Math.sqrt(max) - Math.sqrt(min));
    let size = (many ? 18 : 22) + r * (many ? 44 : 70);
    const len = [...d.text].length;
    if (len > 12) size = Math.min(size, Math.max(17, 34 - (len - 12) * 0.35));
    const words = d.text.split(' ').length;
    return `<span class="bub hue${d.c}${words <= 3 ? ' one' : ''}" style="font-size:${Math.round(size)}px;${anim ? `animation-delay:${i * 35}ms` : 'animation:none'}">${esc(d.text)}${d.n > 1 ? `<b class="x num">×${d.n}</b>` : ''}</span>`;
  }).join('')}</div>`;
  fitCloud(viz);
}
function fitCloud(viz) {
  const c = viz.querySelector('.cloud'); if (!c) return;
  for (let k = 0; k < 12 && c.scrollHeight > viz.clientHeight + 2; k++) {
    c.querySelectorAll('.bub').forEach(b => { b.style.fontSize = Math.max(13, parseFloat(b.style.fontSize) * 0.88) + 'px'; });
  }
}

function renderResults(viz, q, list, reveal) {
  const opts = q.type === 'yesno' ? ['כן', 'לא'] : (q.options || []);
  const counts = opts.map(o => list.filter(a => a.value === o).length);
  const tot = list.length;
  const pct = i => tot ? Math.round(counts[i] / tot * 100) : 0;
  if (!reveal) { viz.innerHTML = `<div class="hidden-results"><div><b class="num">${tot}</b>הצבעות. התוצאות ייחשפו בעוד רגע</div></div>`; return; }
  const fresh = viz.dataset.fresh === '1' || !viz.firstElementChild || viz.firstElementChild.dataset.n !== String(opts.length) || viz.firstElementChild.dataset.t !== q.type;
  if (q.type === 'yesno') {
    if (fresh) viz.innerHTML = `<div class="yn" data-n="2" data-t="yesno">${['yes', 'no'].map((k, i) => `<div class="col ${k}"><div class="bar-wrap"><div class="bar" style="height:0%"></div></div><div class="lbl"><span>${opts[i]}</span><b class="num"></b></div><div class="muted num cnt"></div></div>`).join('')}</div>`;
    const cols = $$('.col', viz);
    requestAnimationFrame(() => cols.forEach((col, i) => { col.querySelector('.bar').style.height = Math.max(tot ? counts[i] / Math.max(...counts) * 100 : 0, 1) + '%'; col.querySelector('b').textContent = pct(i) + '%'; col.querySelector('.cnt').textContent = counts[i] + ' קולות'; }));
  } else {
    if (fresh) viz.innerHTML = `<div class="bars" data-n="${opts.length}" data-t="choice">${opts.map((o, i) => `<div class="brow"><div class="name">${esc(o)}</div><div class="track"><div class="fill" style="width:0%"></div></div><div class="pct num"></div></div>`).join('')}</div>`;
    const rows = $$('.brow', viz);
    const mx = Math.max(...counts);
    requestAnimationFrame(() => rows.forEach((r, i) => { r.classList.toggle('top', mx > 0 && counts[i] === mx); r.querySelector('.fill').style.width = (mx ? counts[i] / mx * 100 : 0) + '%'; r.querySelector('.pct').innerHTML = `${pct(i)}%<small>${counts[i]}</small>`; }));
  }
}

function renderSummary(viz, q, list) {
  const s = (H.room.summaries || {})[q.id];
  if (H.busy['sum' + q.id]) { viz.innerHTML = `<div class="thinking">${WAVE}<div>ה-AI קורא ${list.length} תשובות ומחפש את הנושאים שחוזרים…</div></div>`; return; }
  if (!s) {
    viz.innerHTML = list.length
      ? `<div class="empty"><div><p>${list.length} תשובות מחכות לסיכום.</p><button class="btn primary" data-act="summarize">סכמו עם AI</button></div></div>`
      : '<div class="empty">אין עדיין תשובות לסכם</div>';
    return;
  }
  const d = s.data || {}, themes = (d.themes || []).slice(0, 5);
  const newer = list.length - (s.n || 0);
  viz.innerHTML = `<div class="sum"><p class="sum-head">${esc(d.headline || '')}</p>
    <div class="themes">${themes.map((t, i) => `<div class="theme" style="animation-delay:${i * 90}ms"><h3>${esc(t.title)}</h3>
      <div class="meter"><i style="width:${Math.min(100, Math.round((+t.count || 0) / Math.max(1, s.n) * 100))}%"></i></div>
      <div class="n num">כ-${esc(t.count)} תשובות</div>${t.quote ? `<q>${esc(t.quote)}</q>` : ''}</div>`).join('')}</div>
    <div class="ai-note"><span>סוכם ע"י AI מתוך ${s.n} תשובות · ${timeAgo(s.at)}</span>${newer > 0 ? `<button class="btn" data-act="summarize">רענון (+${newer} חדשות)</button>` : ''}</div></div>`;
}

async function summarize() {
  const q = curQ(); if (!q) return;
  const list = ansFor(q.id); if (!list.length) return;
  const prov = await AI.provider();
  if (!prov) { openSettings('כדי לקבל סיכום AI הדביקו מפתח Gemini חינמי (הסבר למטה).'); return; }
  H.busy['sum' + q.id] = true; renderHost();
  try {
    const texts = list.slice(0, 400).map(a => String(a.value).slice(0, 280));
    const data = await AI.json(summaryPrompt(q, texts));
    await B.saveRoom(H.code, { summaries: { [q.id]: { n: texts.length, at: Date.now(), data } } });
  } catch (e) { console.error(e); toast(e.code === 'NO_AI' ? 'לא הוגדר AI' : 'הסיכום נכשל: ' + (e.message || e.code)); }
  H.busy['sum' + q.id] = false; renderHost();
}

async function go(newIdx) {
  const d = deck(); if (newIdx < -1 || newIdx >= d.length) return;
  const q = d[newIdx];
  const cur2 = q ? { idx: newIdx, qid: q.id, open: ansFor(q.id).length === 0, view: q.type === 'open' ? 'wall' : 'results', reveal: true } : { idx: -1, qid: null, open: false, view: 'wall', reveal: true };
  try { await B.replaceField(H.code, 'cur', cur2); } catch (e) { toast('שגיאה: ' + (e.code || e.message)); }
}
async function patchCur(p) { try { await B.replaceField(H.code, 'cur', { ...cur(), ...p }); } catch (e) { toast('שגיאה: ' + (e.code || e.message)); } }

function hostClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, c = cur();
  if (b.closest('.tools-menu')) { H.menuOpen = false; }
  if (a === 'next') go(c.idx + 1);
  else if (a === 'prev') go(c.idx - 1);
  else if (a === 'toggleOpen') patchCur({ open: !c.open });
  else if (a === 'view') { patchCur({ view: b.dataset.v }); if (b.dataset.v === 'summary') { const q = curQ(); if (q && !(H.room.summaries || {})[q.id] && ansFor(q.id).length) summarize(); } }
  else if (a === 'reveal') patchCur({ reveal: c.reveal === false });
  else if (a === 'summarize') summarize();
  else if (a === 'hide') B.hide(H.code, b.dataset.id, true).then(() => toast('התשובה הוסתרה מהמסך')).catch(x => toast('שגיאה: ' + (x.code || x.message)));
  else if (a === 'side') { H.showSide = !H.showSide; LS.set('side', H.showSide); renderHost(); }
  else if (a === 'theme') { const order = ['', 'dark', 'light'], t = LS.get('theme', ''); const n = order[(order.indexOf(t) + 1) % 3]; LS.set('theme', n); if (n) document.documentElement.setAttribute('data-theme', n); else document.documentElement.removeAttribute('data-theme'); toast(n === 'dark' ? 'ערכה כהה' : n === 'light' ? 'ערכה בהירה (מומלץ למקרן באולם מואר)' : 'לפי הגדרות המחשב'); }
  else if (a === 'fs') { const el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => toast('מסך מלא לא זמין כאן. נסו F11.')); }
  else if (a === 'settings') openSettings();
  else if (a === 'deck') openDeck();
  else if (a === 'report') openReport();
  else if (a === 'csv') exportCSV();
  else if (a === 'sim') simulate();
  else if (a === 'bigqr') showBigQR();
  else if (a === 'phone') togglePhone(!H.phone);
}

function showBigQR() {
  const el = document.createElement('div'); el.className = 'bigqr'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'קוד QR להצטרפות');
  el.innerHTML = `<div><h2>סרקו והצטרפו</h2><div class="join-url">${esc(joinURL().replace(/^https?:\/\//, ''))}</div><div class="eyebrow" style="margin-top:3vh">קוד חדר</div><div class="room-code">${esc(H.code)}</div><p class="muted">לחיצה בכל מקום או Esc לסגירה</p></div><div class="qr">${qrSVG(joinURL())}</div>`;
  const close = () => { el.remove(); document.removeEventListener('keydown', onK, true); };
  const onK = e => { if (e.key === 'Escape' || e.key === 'g' || e.key === 'ע') { e.stopPropagation(); close(); } };
  el.onclick = close; document.addEventListener('keydown', onK, true); document.body.appendChild(el);
}
function hostKeys(e) {
  if (e.target.closest('input,textarea,select') || H.modal) { if (e.key === 'Escape' && H.modal) closeModal(); return; }
  const c = cur(), k = e.key;
  if (k === 'ArrowLeft' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(c.idx + 1); }
  else if (k === 'ArrowRight' || k === 'PageUp') { e.preventDefault(); go(c.idx - 1); }
  else if (k === 'o' || k === 'O' || k === 'ם') patchCur({ open: !c.open });
  else if ((k === 'w' || k === "'") && curQ() && curQ().type === 'open') patchCur({ view: 'wall' });
  else if ((k === 'c' || k === 'ב') && curQ() && curQ().type === 'open') patchCur({ view: 'cloud' });
  else if ((k === 's' || k === 'ד') && curQ() && curQ().type === 'open') hostClick({ target: Object.assign(document.createElement('b'), { dataset: { act: 'view', v: 'summary' } }) });
  else if (k === 'g' || k === 'ע') showBigQR();
  else if (k === 'q' || k === '/') { H.showSide = !H.showSide; LS.set('side', H.showSide); renderHost(); }
  else if (k === 'f' || k === 'כ') hostClick({ target: Object.assign(document.createElement('b'), { dataset: { act: 'fs' } }) });
}

function reportBlocks() {
  return deck().map((q, i) => {
    const list = ansFor(q.id); if (!list.length) return '';
    let body;
    if (q.type === 'open') body = list.slice(0, 150).map(a => '- ' + String(a.value).replace(/\s+/g, ' ').slice(0, 200)).join('\n');
    else { const opts = q.type === 'yesno' ? ['כן', 'לא'] : q.options; body = opts.map(o => { const n = list.filter(a => a.value === o).length; return `- ${o}: ${n} (${Math.round(n / list.length * 100)}%)`; }).join('\n'); }
    return `### שאלה ${i + 1} (${TYPE_LABEL[q.type]}, ${list.length} עונים): ${q.text}\n${body}`;
  }).filter(Boolean).join('\n\n');
}
async function openReport() {

async function makeReport() {

  catch (e) { console.error(e); toast('הניתוח נכשל: ' + (e.message || e.code)); }
  H.busy.report = false; renderReport();
}

/* ---------------- export ---------------- */
function exportCSV() {
  const rows = [['מספר שאלה', 'שאלה', 'סוג', 'תשובה', 'שם', 'זמן', 'הוסתרה']];
  const d = deck();
  const byQ = new Map(d.map((q, i) => [q.id, [i + 1, q]]));
  [...H.answers].sort((a, b) => (byQ.get(a.qid)?.[0] || 99) - (byQ.get(b.qid)?.[0] || 99) || a.t - b.t).forEach(a => {
    const [n, q] = byQ.get(a.qid) || ['', { text: '(שאלה שנמחקה)', type: '' }];
    rows.push([n, q.text, TYPE_LABEL[q.type] || '', a.value, a.name || '', new Date(a.t).toLocaleString('he-IL'), a.hidden ? 'כן' : '']);
  });
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const fname = `dofek-${H.code}-${new Date().toISOString().slice(0, 10)}.csv`;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(dl => dl ? dl.save({ filename: fname, data: csv }).then(() => toast(`יוצאו ${rows.length - 1} תשובות`), () => { }) : toast('ההורדה לא זמינה בתצוגה הזו')); return;
  }
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast(`יוצאו ${rows.length - 1} תשובות`);
  } catch (e) { toast('ההורדה נחסמה כאן'); }
}

  function render(force) {
    const r = S.room, c = (r && r.cur) || { idx: -1 }, q = r && r.deck && r.deck[c.idx];
    const key = JSON.stringify([!!r, r && r.title, S.joined, c.idx, c.open, q, S.mine[q && q.id], S.editing[q && q.id], S.busy, S.err]);
    if (!force && key === S.key) return; S.key = key;
    const act = document.activeElement, hadFocus = act && root.contains(act) && act.tagName === 'TEXTAREA';
    let body;
    if (!r) body = `<div class="stu-card"><h2 class="stu-q" style="font-size:34px">לא מצאנו את החדר <span dir="ltr">${esc(code)}</span></h2><p class="muted">בדקו את הקוד שעל המסך ונסו שוב.</p><a class="btn" href="?">הקלדת קוד אחר</a></div>`;

        <div class="field"><label for="nm">שם פרטי (לא חובה)</label><input class="input" id="nm" maxlength="30" value="${esc(S.name)}" autocomplete="given-name"></div>
        <button class="btn primary send" type="submit">נכנסים</button></form>`;
    else if (c.idx < 0 || !q) body = `<div class="stu-wait">${WAVE}<h2>אתם בפנים${S.name ? ', ' + esc(S.name) : ''}!</h2><div>תסתכלו על המסך. השאלה הראשונה תופיע כאן אוטומטית.</div></div>`;
    else {
      const mine = S.mine[q.id], editing = S.editing[q.id] || mine == null;
      let ctl = '';
      if (!c.open) ctl = `<div class="muted">ההצבעה על השאלה הזו סגורה. תסתכלו על המסך${mine != null ? '' : ', השאלה הבאה תופיע כאן'}.</div>${mine != null ? `<div class="sent">✓ ענית: ${esc(mine)}</div>` : ''}`;
      else if (q.type === 'yesno') ctl = `<div class="yn-btns"><button class="y ${mine === 'כן' ? 'sel' : ''}" data-u="pick" data-v="כן" ${S.busy ? 'disabled' : ''}>כן</button><button class="n ${mine === 'לא' ? 'sel' : ''}" data-u="pick" data-v="לא" ${S.busy ? 'disabled' : ''}>לא</button></div>${mine != null ? '<div class="sent">✓ נקלט. אפשר לשנות עד שההצבעה נסגרת</div>' : ''}`;
      else if (q.type === 'choice') ctl = `<div style="display:grid;gap:10px">${(q.options || []).map(o => `<button class="opt ${mine === o ? 'sel' : ''}" data-u="pick" data-v="${esc(o)}" ${S.busy ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>${mine != null ? '<div class="sent">✓ נקלט. אפשר לשנות עד שההצבעה נסגרת</div>' : ''}`;
      else if (!editing) ctl = `<div class="sent">✓ התשובה שלך על המסך</div><div class="card" style="box-shadow:none">${esc(mine)}</div><button class="btn" data-u="edit">עריכת התשובה</button>`;
      else ctl = `<form data-u="open" style="display:grid;gap:10px"><textarea class="input" id="ans-${esc(q.id)}" maxlength="280" placeholder="כתבו כאן…" aria-label="התשובה שלך">${esc(S.draft[q.id] ?? mine ?? '')}</textarea>
          <div class="count-hint num"><span class="cc">${(S.draft[q.id] ?? mine ?? '').length}</span>/280</div>
          <button class="btn primary send" type="submit" ${S.busy ? 'disabled' : ''}>${S.busy ? 'שולח…' : 'שליחה'}</button></form>`;
      body = `<div class="stu-card"><div class="eyebrow">${TYPE_LABEL[q.type]}</div><h2 class="stu-q">${esc(q.text)}</h2>${ctl}${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}</div>`;
    }
    if (r) applyAccent(r.accent);
    root.innerHTML = `<div class="stu"><div><div class="stu-top"><span class="logo" role="img" aria-label="SCE"></span>${markHTML()}</div><div class="stu-room">${esc((r && r.title) || '')}</div></div>${body}
      <div class="stu-foot">אנונימי כברירת מחדל${S.name && S.joined ? ` · מופיעים בתור ${esc(S.name)}` : ''}</div></div>`;
    if (hadFocus) { const ta = root.querySelector('textarea'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  }

  async function send(q, value) {
    S.busy = true; S.err = ''; render();
    try {
      await B.submit(code, { qid: q.id, value, name: S.name });
      S.mine[q.id] = value; saveMine(); S.editing[q.id] = false; delete S.draft[q.id];
      if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) { }
    } catch (e) {
      console.error(e);
      S.err = e.code === 'permission-denied' ? 'לא נשמר: ייתכן שההצבעה נסגרה בדיוק עכשיו.' : 'לא נשמר. בדקו את החיבור לאינטרנט ונסו שוב.';
    }
    S.busy = false; render(true);
  }

  root.addEventListener('submit', async e => {
    const f = e.target.closest('[data-u]'); if (!f) return; e.preventDefault();
    if (f.dataset.u === 'join') {
      S.name = ($('#nm', root).value || '').trim().slice(0, 30); LS.set('name', S.name);
      try { await B.join(code, S.name); S.joined = true; LS.set('joined.' + code, true); render(); }
      catch (x) { console.error(x); S.err = 'לא הצלחנו להתחבר. נסו שוב.'; render(true); }
    } else if (f.dataset.u === 'open') {
      const q = S.room.deck[S.room.cur.idx]; const v = (f.querySelector('textarea').value || '').trim().slice(0, 280);
      if (!v) return; send(q, v);
    }
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-u]'); if (!b || b.tagName === 'FORM') return;
    const q = S.room && S.room.deck && S.room.deck[S.room.cur.idx];
    if (b.dataset.u === 'pick' && q) send(q, b.dataset.v);
    else if (b.dataset.u === 'edit' && q) { S.editing[q.id] = true; render(); }
  });
  root.addEventListener('input', e => {
    if (e.target.tagName !== 'TEXTAREA') return; const q = S.room.deck[S.room.cur.idx];
    S.draft[q.id] = e.target.value; const cc = root.querySelector('.cc'); if (cc) cc.textContent = e.target.value.length;
  });

  render(true);
  B.anon().then(() => B.watchRoom(code, r => { S.room = r; render(); }, e => { console.error(e); root.innerHTML = `<div class="stu"><div class="stu-card"><h2 class="stu-q" style="font-size:32px">בעיית חיבור</h2><p class="muted">רעננו את הדף. (${esc(e.code || e.message)})</p></div></div>`; }))
    .catch(e => { console.error(e); root.innerHTML = `<div class="stu"><div class="stu-card"><h2 class="stu-q" style="font-size:32px">לא הצלחנו להתחבר</h2><p class="muted">בדקו את החיבור לאינטרנט ורעננו. (${esc(e.code || e.message)})</p></div></div>`; });
}

function renderLanding(root) {
  root.innerHTML = `<div class="center-page"><form class="panel" id="land"><div>${brandHTML()}</div>
    <h1>הצטרפות</h1><p class="muted" style="margin:0">הקלידו את קוד החדר שמופיע על המסך</p>
    <input class="input" id="code" dir="ltr" maxlength="10" required autocapitalize="characters" style="font-size:28px;text-align:center;letter-spacing:.1em" aria-label="קוד חדר">
    <button class="btn primary send" type="submit">כניסה</button>
    <a class="muted" href="?host" style="font-size:13px">כניסת מנחה</a></form></div>`;
  $('#land').addEventListener('submit', e => { e.preventDefault(); location.search = '?r=' + encodeURIComponent($('#code').value.trim().toUpperCase()); });
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  applyTheme();
  const root = $('#app');
  const p = new URLSearchParams(location.search);
  const wantHost = p.has('host') || location.hash === '#host';
  const room = (p.get('r') || '').trim().toUpperCase();
  try {
    B = FIREBASE_CONFIG && !p.has('demo') ? await makeLive() : makeDemo();
  } catch (e) {
    console.error(e);
    root.innerHTML = `<div class="center-page"><div class="panel"><div>${brandHTML()}</div><h1 style="font-size:36px">לא הצלחנו להתחבר</h1><p class="muted">בדקו את החיבור לאינטרנט ורעננו את הדף.</p></div></div>`;
    return;
  }
  if (B.mode === 'demo') return startHost(root);
  if (wantHost) return startHost(root);
  if (room) return createStudent(root, room, false);
  renderLanding(root);
})();
</script></body></html>
